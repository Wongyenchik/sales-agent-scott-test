<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Agent Test Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <h1>Sales Agent Web Chat</h1>
          <p>Type an email-like message and test the backend workflow.</p>
        </div>
        <div id="backendStatus" class="status-pill">Checking backend...</div>
      </header>

      <section id="chatLog" class="chat-log" aria-live="polite"></section>

      <section class="composer">
        <div class="composer-grid">
          <label>
            Backend URL
            <input id="backendUrl" type="text" value="http://localhost:8080" />
          </label>
          <label>
            Sender name
            <input id="senderName" type="text" value="Alex" />
          </label>
          <label>
            Sender email
            <input id="senderEmail" type="email" value="alex@example.com" />
          </label>
          <label>
            Subject
            <input id="subject" type="text" placeholder="Example: Order 4500012345 status" />
          </label>
          <label>
            Message
            <textarea
              id="message"
              rows="5"
              placeholder="Example: Hi team, can you check order 4500012345 and send an update?"
            ></textarea>
          </label>
        </div>
        <div class="composer-actions">
          <button id="sendBtn" type="button">Send</button>
          <button id="clearBtn" type="button" class="ghost">Clear chat</button>
        </div>
      </section>
    </main>

    <template id="bubbleTemplate">
      <article class="bubble">
        <div class="bubble-role"></div>
        <pre class="bubble-body"></pre>
        <details class="bubble-meta-wrap">
          <summary>Details</summary>
          <pre class="bubble-meta"></pre>
        </details>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
