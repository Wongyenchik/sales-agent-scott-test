<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Agent Outlook</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="./taskpane.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand">Sales Agent</div>
        <div id="status" class="status">Waiting for Outlook...</div>
      </header>

      <section id="chatLog" class="chat-log" aria-live="polite">
        <article class="message-row assistant-row">
          <div class="avatar" aria-hidden="true">AI</div>
          <div class="assistant-card">
            <div class="assistant-name">Assistant</div>
            <div id="assistantThread" class="assistant-thread">
              <div class="line">Loading the selected email and showing the key details here.</div>
            </div>
          </div>
        </article>
      </section>

      <footer class="composer" aria-label="Chat input">
        <form id="promptForm" class="composer-form">
          <input
            id="promptInput"
            class="prompt-input"
            type="text"
            placeholder="Type your prompt about this email..."
            maxlength="3000"
            autocomplete="off"
          />
          <button id="sendButton" class="send-button" type="submit">Send</button>
        </form>
      </footer>
    </main>

    <script type="module" src="./taskpane.js"></script>
  </body>
</html>
